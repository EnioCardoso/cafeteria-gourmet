<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Grão Nobre</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase-client.js"></script><script defer src="js/common.js"></script><script defer src="js/carrinho.js"></script><script defer src="js/pedidos.js"></script></head><body><main><h1>Finalizar pedido</h1><form onsubmit="checkout(event)"><label>Endereço completo<textarea name="endereco" required placeholder="Rua, número, complemento, bairro, cidade e CEP"></textarea></label><label>Forma de pagamento<select required><option>PIX</option><option>Cartão de crédito</option><option>Cartão de débito</option></select></label><p>Pagamento simulado: ao confirmar, o pedido será registrado como recebido.</p><button>Confirmar e pagar</button></form></main></body></html>
