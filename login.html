<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acessar | Grão Nobre</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase-client.js"></script><script defer src="js/common.js"></script><script defer src="js/auth.js"></script></head><body><main><p id="auth-msg"></p><section class="grid"><form onsubmit="signIn(event)"><h1>Entrar</h1><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="senha" type="password" required></label><button>Entrar</button></form><form onsubmit="signUp(event)"><h1>Criar conta</h1><label>Nome<input name="nome" required></label><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="senha" type="password" minlength="8" required></label><button>Cadastrar</button></form></section></main></body></html>
