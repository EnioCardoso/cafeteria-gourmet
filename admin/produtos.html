<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos | Admin</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="../js/supabase-client.js"></script><script defer src="../js/common.js"></script><script defer src="../js/admin.js"></script></head><body><main><h1>Gerenciar produtos</h1><form id="product-form" onsubmit="saveProduct(event)"><input type="hidden" name="id"><label>Nome<input name="nome" required></label><label>Descrição<textarea name="descricao" required></textarea></label><label>Preço<input name="preco" type="number" min="0.01" step="0.01" required></label><label>URL da imagem<input name="foto_url" type="url" required></label><label>Categoria<input name="categoria" required></label><label><input name="ativo" type="checkbox" checked> Produto ativo</label><button>Salvar produto</button> <button type="button" onclick="editProduct()">Limpar</button></form><table><thead><tr><th>Produto</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody id="admin-products"></tbody></table></main><script>document.addEventListener('DOMContentLoaded',adminProducts)</script></body></html>
